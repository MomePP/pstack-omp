name: sync

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

defaults:
  run:
    shell: bash

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Sync latest pstack-claude tag
        run: bash scripts/sync.sh | tee sync.log

      - name: Gate
        id: gate
        continue-on-error: true
        run: bash scripts/check.sh | tee check.log

      - name: PR body
        id: meta
        run: |
          tag=$(jq -r .tag upstream.lock.json)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          {
            echo "Upstream: https://github.com/michael-denyer/pstack-claude/releases/tag/$tag"
            echo
            echo "Gate: ${{ steps.gate.outcome }}"
            if [ "${{ steps.gate.outcome }}" = success ]; then
              echo "Auto-merge: on. GitHub merges this PR once the required \`check\` passes."
            else
              echo "Auto-merge: off. The gate failed; fix it on main and rerun the sync."
            fi
            echo
            echo '```'
            cat check.log
            echo '```'
            echo
            echo '```'
            cat sync.log
            echo '```'
          } > pr-body.md
          rm sync.log check.log

      - uses: peter-evans/create-pull-request@v8
        id: pr
        with:
          branch: sync/pstack-claude
          delete-branch: true
          title: "chore(sync): pstack-claude ${{ steps.meta.outputs.tag }}"
          commit-message: "chore(sync): pstack-claude ${{ steps.meta.outputs.tag }}"
          body-path: pr-body.md
          add-paths: |
            plugin/skills
            upstream-licenses
            upstream.lock.json
            .omp-plugin/marketplace.json
          draft: ${{ steps.gate.outcome == 'failure' }}

      - name: Enable auto-merge
        if: steps.gate.outcome == 'success' && (steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated')
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.pull-request-number }}
        run: |
          gh pr merge "$PR" --auto --squash \
            || echo "::warning::could not enable auto-merge on PR #$PR; left open for review"
