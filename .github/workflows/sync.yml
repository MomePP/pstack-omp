name: sync

on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [port.lock.json]

concurrency:
  group: sync
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

defaults:
  run:
    shell: bash

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Sync latest pstack-claude tag
        run: bash scripts/sync.sh | tee sync.log

      - name: Gate
        id: gate
        continue-on-error: true
        run: bash scripts/check.sh | tee check.log

      - name: PR body
        id: meta
        run: |
          tag=$(jq -r .tag upstream.lock.json)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          port=$(grep -c '^port: ' sync.log || true)
          [ "$port" -eq 0 ] || echo "hold=true" >> "$GITHUB_OUTPUT"
          {
            echo "Upstream: https://github.com/michael-denyer/pstack-claude/releases/tag/$tag"
            echo
            echo "Gate: ${{ steps.gate.outcome }}"
            if [ "${{ steps.gate.outcome }}" != success ]; then
              echo "Auto-merge: off. The gate failed; fix it on main and rerun the sync."
            elif [ "$port" -ne 0 ]; then
              from=$(jq -r '.tag // empty' port.lock.json 2>/dev/null || true)
              echo "Auto-merge: off. Upstream changed files that plugin/agents or plugin/rules port by hand (the \`port:\` lines below)."
              if [ -n "$from" ]; then
                echo "Changes since the last ported tag: https://github.com/michael-denyer/pstack-claude/compare/$from...$tag"
              fi
              echo "Port them on main, then run \`scripts/sync.sh --ack $tag\` and commit \`port.lock.json\`. The next sync run arms auto-merge."
            else
              echo "Auto-merge: on. GitHub merges this PR once the required \`check\` passes."
            fi
            echo
            echo '```'
            cat check.log
            echo '```'
            echo
            echo '```'
            cat sync.log
            echo '```'
          } > pr-body.md
          rm sync.log check.log

      - uses: peter-evans/create-pull-request@v8
        id: pr
        with:
          token: ${{ secrets.SYNC_TOKEN || github.token }}
          branch: sync/pstack-claude
          delete-branch: true
          title: "chore(sync): pstack-claude ${{ steps.meta.outputs.tag }}"
          commit-message: "chore(sync): pstack-claude ${{ steps.meta.outputs.tag }}"
          body-path: pr-body.md
          add-paths: |
            plugin/skills
            plugin/agents/comment-sicko.md
            upstream-licenses
            upstream.lock.json
            .omp-plugin/marketplace.json
          draft: ${{ steps.gate.outcome == 'failure' }}

      - name: Mark ready and set auto-merge
        if: steps.gate.outcome == 'success' && (steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated')
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.pull-request-number }}
          HOLD: ${{ steps.meta.outputs.hold }}
        run: |
          # create-pull-request sets draft only on create; a PR drafted by an earlier failed gate stays draft.
          if [ "$(gh pr view "$PR" --json isDraft -q .isDraft)" = true ]; then
            gh pr ready "$PR"
          fi
          if [ "$HOLD" != true ]; then
            gh pr merge "$PR" --auto --squash \
              || echo "::warning::could not enable auto-merge on PR #$PR; left open for review"
          else
            armed=$(gh pr view "$PR" --json autoMergeRequest -q '.autoMergeRequest != null')
            if [ "$armed" = true ]; then
              gh pr merge "$PR" --disable-auto
            fi
          fi
